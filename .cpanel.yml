---
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/public_html/"
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -f index.html "$DEPLOYPATH"
    - /bin/cp -f styles.css "$DEPLOYPATH"
    - /bin/cp -f script.js "$DEPLOYPATH"
    - /bin/cp -f favicon.svg "$DEPLOYPATH"
    - /bin/cp -f hero-sengketa.webp "$DEPLOYPATH"
    - /bin/cp -f hero-bg.webp "$DEPLOYPATH"
    - /bin/cp -f timbangan-law.webp "$DEPLOYPATH"
    - /bin/cp -f hero-sengketa.png "$DEPLOYPATH"
    - /bin/cp -f hero-bg.png "$DEPLOYPATH"
    - /bin/cp -f timbangan-law.png "$DEPLOYPATH"
